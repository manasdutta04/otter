[project]
name = "otter-mcp"
version = "0.2.0"
description = "Otter MCP — repository brain and verification layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Manas Dutta", email = "manasdutta@users.noreply.github.com" }]
keywords = ["mcp", "otter", "ai", "cursor", "claude", "code-intelligence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.6.0,<2",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/manasdutta04/otter"
Documentation = "https://otter.manasdutta.com/docs/mcp"
Repository = "https://github.com/manasdutta04/otter"
Issues = "https://github.com/manasdutta04/otter/issues"

[project.scripts]
otter-mcp = "otter_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otter_mcp", "packages"]

[tool.hatch.build.targets.sdist]
include = [
  "otter_mcp",
  "packages",
  "README.md",
  "pyproject.toml",
  "server.json",
  "hatch_build.py",
  "package_data",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
