[project]
name = "otter-mcp"
version = "0.2.0"
description = "Otter MCP — repository brain and verification layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.27.0",
]

[project.scripts]
otter-mcp = "otter_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["otter_mcp*"]
