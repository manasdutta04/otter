[project]
name = "veridexs-cli"
version = "0.1.0"
description = "Command-line client for veridexs engineering intelligence"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.scripts]
veridexs = "veridexs_cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
