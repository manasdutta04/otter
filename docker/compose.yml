services:
  migration:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: alembic upgrade head
    volumes: ["../apps/api:/workspace", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment: {REPOSITORY_DATA_DIR: /data/repositories}
    depends_on: [postgres]
  api:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["../apps/api:/workspace", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment:
      REPOSITORY_DATA_DIR: /data/repositories
    ports: ["8000:8000"]
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build: {context: .., dockerfile: docker/web/Dockerfile}
    working_dir: /workspace
    command: npm run dev
    volumes: ["../apps/web:/workspace", "web_node_modules:/workspace/node_modules"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes: ["../apps/api:/workspace", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment: {REPOSITORY_DATA_DIR: /data/repositories}
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: veridexs, POSTGRES_PASSWORD: veridexs, POSTGRES_DB: veridexs}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
  repository_data:
  web_node_modules:
