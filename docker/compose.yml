services:
  migration:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: alembic upgrade head
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment: {REPOSITORY_DATA_DIR: /data/repositories, PYTHONPATH: /workspace}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment:
      REPOSITORY_DATA_DIR: /data/repositories
      PYTHONPATH: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build: {context: .., dockerfile: docker/web/Dockerfile}
    working_dir: /workspace
    command: npm run dev
    volumes: ["../apps/web:/workspace", "web_node_modules:/workspace/node_modules"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000, NEXT_PUBLIC_URL: http://localhost:3000}
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment: {REPOSITORY_DATA_DIR: /data/repositories, PYTHONPATH: /workspace}
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  github-app:
    build: {context: .., dockerfile: apps/github-app/Dockerfile}
    working_dir: /workspace
    volumes: ["../apps/github-app:/workspace"]
    env_file:
      - path: ../.env
        required: false
    environment: {OTTER_API_URL: http://api:8000}
    ports: ["9000:9000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: otter, POSTGRES_PASSWORD: otter, POSTGRES_DB: otter}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otter -d otter"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
  repository_data:
  web_node_modules:
