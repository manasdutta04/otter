services:
  api:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["../apps/api:/workspace", "repository_data:/data/repositories"]
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://localhost:3000}
      REPOSITORY_DATA_DIR: /data/repositories
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build: {context: .., dockerfile: docker/web/Dockerfile}
    working_dir: /workspace
    command: npm run dev
    volumes: ["../apps/web:/workspace", "web_node_modules:/workspace/node_modules"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: veridexs, POSTGRES_PASSWORD: veridexs, POSTGRES_DB: veridexs}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
  repository_data:
  web_node_modules:
