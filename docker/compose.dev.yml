# Contributor mode — bind-mount development stack.
# End users should use Docker Hub + https://otter.manasdutta.com/docker-compose.yml instead.
#
#   cp .env.example .env
#   docker compose -f docker/compose.dev.yml up --build

name: otter-dev

services:
  migration:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: alembic upgrade head
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment:
      # Override host .env 127.0.0.1 URLs — containers must use compose service DNS.
      DATABASE_URL: postgresql+asyncpg://otter:otter@postgres:5432/otter
      REDIS_URL: redis://redis:6379/0
      REPOSITORY_DATA_DIR: /data/repositories
      PYTHONPATH: /workspace
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://otter:otter@postgres:5432/otter
      REDIS_URL: redis://redis:6379/0
      REPOSITORY_DATA_DIR: /data/repositories
      PYTHONPATH: /workspace
      # Do not reuse native LLM_BASE_URL=127.0.0.1 from .env (container loopback).
      LLM_BASE_URL: ${PLATFORM_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build: {context: .., dockerfile: docker/web/Dockerfile}
    working_dir: /workspace
    command: npm run dev
    volumes: ["../apps/web:/workspace", "web_node_modules:/workspace/node_modules"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000, NEXT_PUBLIC_URL: http://localhost:3000}
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: {context: .., dockerfile: docker/api/Dockerfile}
    working_dir: /workspace
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes: ["../apps/api:/workspace", "../packages:/workspace/packages", "repository_data:/data/repositories"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://otter:otter@postgres:5432/otter
      REDIS_URL: redis://redis:6379/0
      REPOSITORY_DATA_DIR: /data/repositories
      PYTHONPATH: /workspace
      LLM_BASE_URL: ${PLATFORM_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
  github-app:
    profiles: ["github"]
    build: {context: .., dockerfile: apps/github-app/Dockerfile}
    working_dir: /workspace
    volumes: ["../apps/github-app:/workspace"]
    env_file:
      - path: ../.env
        required: false
    environment: {OTTER_API_URL: http://api:8000}
    ports: ["9000:9000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: otter, POSTGRES_PASSWORD: otter, POSTGRES_DB: otter}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otter -d otter"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
  repository_data:
  web_node_modules:
