name: Publish @otter-engg/cli

# Publishes @otter-engg/cli with npm Trusted Publisher (OIDC).
# Configure once on npmjs.com → package → Trusted Publisher → GitHub Actions:
#   manasdutta04 / otter / cli-publish.yml

on:
  push:
    branches: [main]
    tags:
      - "cli-v*"
  workflow_dispatch:

concurrency:
  group: npm-cli-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Do not set registry-url — it writes an .npmrc with always-auth and
      # empty _authToken, which breaks OIDC trusted publishing (false E404).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            VERSION="${GITHUB_REF_NAME#cli-v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must look like cli-v1.2.3 (got ${GITHUB_REF_NAME})"
              exit 1
            fi
            npm version "${VERSION}" --no-git-tag-version
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if version already on npm
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@otter-engg/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@otter-engg/cli@${VERSION} already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & build
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: |
          rm -f .npmrc "$HOME/.npmrc"
          npm publish --access public --provenance
