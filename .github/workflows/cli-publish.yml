name: Publish @otter-engg/cli

# Publish via npm Trusted Publisher (OIDC) — no NPM_TOKEN.
#
# One-time setup on npmjs.com → @otter-engg/cli → Settings → Trusted Publisher:
#   Provider: GitHub Actions
#   Organization or user: manasdutta04
#   Repository: otter
#   Workflow filename: cli-publish.yml   ← must match exactly (one publisher per package)
#   Allowed actions: npm publish
#
# Then optionally: Publishing access → "Require 2FA and disallow tokens"
# (Trusted Publisher still works; classic/automation tokens will not.)
#
# Triggers:
#   - push to main (no-ops quickly if version already on npm)
#   - tag cli-v* (e.g. git tag cli-v0.2.0 && git push origin cli-v0.2.0)
#   - workflow_dispatch
#
# No path filters: tags + Trusted Publisher need this single workflow to always
# be eligible; the "already published" check keeps noise low.
#
# Requires Node ≥ 22.14 and npm ≥ 11.5.1 for OIDC trusted publishing.

on:
  push:
    branches: [main]
    tags:
      - "cli-v*"
  workflow_dispatch:

concurrency:
  group: npm-cli-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publisher + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node ≥ 22.14 and npm ≥ 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            VERSION="${GITHUB_REF_NAME#cli-v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must look like cli-v1.2.3 (got ${GITHUB_REF_NAME})"
              exit 1
            fi
            npm version "${VERSION}" --no-git-tag-version
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Publishing from tag ${GITHUB_REF_NAME} → ${VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Publishing from package.json → ${VERSION}"
          fi

      - name: Skip if version already on npm
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@otter-engg/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@otter-engg/cli@${VERSION} already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Will publish @otter-engg/cli@${VERSION}"
          fi

      - name: Install & build
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Publish to npm (OIDC)
        if: steps.check.outputs.exists == 'false'
        # No NODE_AUTH_TOKEN — npm uses GitHub OIDC via Trusted Publisher.
        # --provenance is automatic with trusted publishing; keep flag for clarity.
        run: npm publish --access public --provenance
