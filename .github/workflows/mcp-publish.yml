name: Publish otter-mcp (PyPI)

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/impact/**"
      - "packages/architecture/**"
      - "packages/verify/**"
      - "packages/retrieval/**"
      - "packages/planner/__init__.py"
      - ".github/workflows/mcp-publish.yml"
    tags:
      - "mcp-v*"
  workflow_dispatch:

concurrency:
  group: pypi-mcp-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -U pip build twine

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [[ "${GITHUB_REF}" == refs/tags/mcp-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "Tag mcp-v${TAG_VERSION} does not match pyproject version ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if version already on PyPI
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/pypi/otter-mcp/${VERSION}/json')"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "otter-mcp==${VERSION} already on PyPI — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/mcp/dist
