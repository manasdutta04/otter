id: task-014
kind: implement
repository: starlette
difficulty: medium
prompt: >
  In starlette/config.py, add a method Config.get_bool(self, key, default=False)
  that returns a boolean. Treat case-insensitive '1', 'true', 'yes', 'on' as True
  and '0', 'false', 'no', 'off' as False. Invalid values should raise ValueError.
  Add a test in tests/test_config.py.
gold:
  relevant_files:
    - starlette/config.py
    - tests/test_config.py
  expected_changes:
    - Add boolean config helper
    - Raise ValueError for invalid values
    - Add regression coverage
  dependencies:
    - Existing project conventions
    - Automated tests
  verification:
    tests:
      - tests/test_config.py
    syntax: py
    expect_in_files:
      - path: starlette/config.py
        contains:
          - get_bool
  allowed_extra_files: []
